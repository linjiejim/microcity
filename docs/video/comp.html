<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>微缩城 MicroCity · 介绍片</title>
<style>
  html, body { margin: 0; background: #faf7f2; overflow: hidden; }
  canvas { display: block; }
</style>
<script src="lib.js"></script>
<script src="content.js"></script>
<script src="timing.js"></script>
<script src="timing.en.js"></script>
<script src=".work/footage/index.js"></script>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// 一张画布、一个 draw(t)：同一个 t 永远画出同一帧（渲染时按帧 seek）。
// 文字与数字都来自 content.js（NUMBERS 那一块），时间来自 timing.js（旁白每一句的起止）。
// 英文版是同一个片子：?lang=en。画面仍按中文旁白的时间线编排（下文的 t 都是这条“编排时间”），
// 片子的时间（英文旁白、字幕、时长、声音事件）经 WARP 映射过来；画面上的字查 content.js 的 UI_EN。
const W = 1920, H = 1080;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const acc = document.createElement('canvas'); acc.width = W; acc.height = H; const actx = acc.getContext('2d');
const { clamp, lerp, seg, ease, tw, spring, rise, leave, win, keyed, hash, rrect } = L;
const EN = new URLSearchParams(location.search).get('lang') === 'en';
const TM = window.MC_TIMING, NUM = MC.NUMBERS, F = NUM.facts, R = NUM.results;
const FILM = EN ? window.MC_TIMING_EN : TM; // 片子的时间线
if (!FILM) throw new Error('缺 timing.en.js：先跑 node docs/video/make_vo.mjs --lang en');
const C = { paper: '#faf7f2', surface: '#ffffff', line: '#e7e0d5', ink: '#26241f', ink2: '#5e5a52', teal: '#1f5f63', amber: '#e3a13a', good: '#3e8e63', bad: '#c2553a', mute: '#bdb5a8' };
const SERIF = EN ? '"Iowan Old Style", "Songti SC", serif' : '"Songti SC", "STSong", serif';
const SANS = EN ? '"Avenir Next", "PingFang SC", sans-serif' : '"PingFang SC", "Hiragino Sans GB", sans-serif';
const DUR = FILM.total, ADUR = TM.total;
// 画面上的字：英文版查表；片名“微缩城”两种语言都保留
const KEEP = new Set([...MC.END.name].map((_, i, a) => a.slice(0, i + 1).join('')).concat([...MC.END.name])); // 片名逐字落下时也量它的前缀
const MISSING = new Set();
function tr(s) {
  if (!EN || typeof s !== 'string' || KEEP.has(s)) return s;
  const v = MC.UI_EN[s];
  if (v !== undefined) return v;
  if (/[一-鿿]/.test(s) && !MISSING.has(s)) { MISSING.add(s); console.error(`没有英文：${s}`); }
  return s;
}

// ─── 时间：每一句的起止、句中某个词的时刻 ───
const LN = Object.fromEntries(TM.lines.map((l) => [l.id, l]));
const T0 = (id) => LN[id].t0, T1 = (id) => LN[id].t1;
const chars = (s) => [...s].length;
function at(id, word, frac = 0) {
  const l = LN[id], i = l.text.indexOf(word);
  if (i < 0) throw new Error(`“${word}”不在 ${id} 里`);
  const ci = chars(l.text.slice(0, i)) + frac * chars(word);
  // 在对应的字幕段里按字数插值（字幕段的边界已经对齐了句中停顿）
  let acc0 = 0;
  for (const s of l.subs) {
    const n = chars(s.text) + 1;
    if (ci <= acc0 + n) return s.t0 + (s.t1 - s.t0) * clamp((ci - acc0) / n);
    acc0 += n;
  }
  return l.t1;
}
/** 任一条时间线里，某句中某个词的时刻（英文版的锚点用） */
function atIn(l, word) {
  const i = l.text.indexOf(word);
  if (i < 0) throw new Error(`“${word}”不在 ${l.id} 里`);
  const ci = chars(l.text.slice(0, i));
  let acc0 = 0;
  for (const s of l.subs) {
    const n = chars(s.text) + 1;
    if (ci <= acc0 + n) return s.t0 + (s.t1 - s.t0) * clamp((ci - acc0) / n);
    acc0 += n;
  }
  return l.t1;
}
// ─── 英文版：编排时间 ↔ 片子时间 ───
// 结点是每句的起止，加上句中意思相同的词（content.js 的 k）；结点之间线性。
let WARP = null;
function initWarp() {
  if (!EN) return;
  const FL = Object.fromEntries(FILM.lines.map((l) => [l.id, l])), K = Object.fromEntries(MC.LINES_EN.map((l) => [l.id, l.k ?? {}]));
  const ks = [[0, 0]];
  for (const a of TM.lines) {
    const b = FL[a.id];
    const inner = Object.entries(K[a.id]).map(([zw, ew]) => [at(a.id, zw), atIn(b, ew)]).sort((p, q) => p[0] - q[0]);
    ks.push([a.t0, b.t0], ...inner, [a.t1, b.t1]);
  }
  ks.push([ADUR, DUR]);
  WARP = [];
  for (const k of ks) { const p = WARP[WARP.length - 1]; if (!p || (k[0] > p[0] + 0.02 && k[1] > p[1] + 0.02)) WARP.push(k); }
}
function pw(x, from, to) {
  const ks = WARP;
  if (x <= ks[0][from]) return ks[0][to] + (x - ks[0][from]);
  for (let i = 1; i < ks.length; i++) {
    const p = ks[i - 1], q = ks[i];
    if (x <= q[from]) return p[to] + ((q[to] - p[to]) * (x - p[from])) / (q[from] - p[from]);
  }
  const z = ks[ks.length - 1];
  return z[to] + (x - z[from]);
}
const toAuth = (t) => (WARP ? pw(t, 1, 0) : t); // 片子时间 → 编排时间
const toFilm = (u) => (WARP ? pw(u, 0, 1) : u); // 编排时间 → 片子时间

// ─── 图片：缺的先登记，seek 等它们都到了再画一遍 ───
const CACHE = new Map();
let PENDING = [], NOLOAD = false;
function img(src) {
  let e = CACHE.get(src);
  if (e) { CACHE.delete(src); CACHE.set(src, e); }
  else {
    if (NOLOAD) return null;
    const im = new Image();
    e = { im, ok: false };
    e.p = new Promise((r) => { im.onload = () => { e.ok = true; r(); }; im.onerror = () => { e.ok = true; e.bad = true; r(); }; });
    im.src = src;
    CACHE.set(src, e);
    if (CACHE.size > 240) CACHE.delete(CACHE.keys().next().value);
  }
  if (!e.ok) PENDING.push(e.p);
  return e.ok && !e.bad ? e.im : null;
}
const FOOT = window.FOOTAGE;
const frame = (shot, f) => img(`.work/footage/${shot}/${String(clamp(Math.round(f), 0, FOOT[shot].n - 1)).padStart(4, '0')}.jpg`);
const click = (shot, sel) => FOOT[shot].clicks.find((c) => c.sel && c.sel.includes(sel));

// ─── 画布小工具 ───
function font(size, face = SANS, weight = 400) { ctx.font = `${weight} ${size}px ${face}`; }
function text(s, x, y, { size = 24, face = SANS, weight = 400, color = C.ink, align = 'left', alpha = 1, base = 'alphabetic' } = {}) {
  if (alpha <= 0.002) return 0;
  s = tr(s);
  font(size, face, weight);
  ctx.globalAlpha = alpha; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = base;
  ctx.fillText(s, x, y);
  ctx.globalAlpha = 1;
  return ctx.measureText(s).width;
}
function measure(s, size, face = SANS, weight = 400) { font(size, face, weight); return ctx.measureText(tr(s)).width; }
/** 字号：放不下 maxW 就按比例缩小（中文的字都放得下，字号不变） */
function fit(s, size, maxW, face = SANS, weight = 400) { return Math.min(size, (size * maxW) / Math.max(1, measure(s, size, face, weight))); }
function shadowed(fn, blur = 30, oy = 10, a = 0.1) {
  ctx.save(); ctx.shadowColor = `rgba(38,36,31,${a})`; ctx.shadowBlur = blur; ctx.shadowOffsetY = oy; fn(); ctx.restore();
}
function card(x, y, w, h, { r = 14, fill = C.surface, stroke = C.line, alpha = 1, shadow = 0.1, dash = null } = {}) {
  if (alpha <= 0.002) return;
  ctx.save(); ctx.globalAlpha = alpha;
  if (shadow) { ctx.shadowColor = `rgba(38,36,31,${shadow})`; ctx.shadowBlur = 34; ctx.shadowOffsetY = 12; }
  rrect(ctx, x, y, w, h, r); ctx.fillStyle = fill; ctx.fill();
  ctx.shadowColor = 'transparent';
  if (stroke) { if (dash) ctx.setLineDash(dash); ctx.lineWidth = 1.5; ctx.strokeStyle = stroke; ctx.stroke(); }
  ctx.restore();
}
function dot(x, y, r, color, alpha = 1) {
  if (alpha <= 0.002 || r <= 0) return;
  ctx.globalAlpha = alpha; ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
}
/** 标签：白底胶囊，前面一个小圆点 */
function chip(s, x, y, { alpha = 1, color = C.teal, size = 22, fill = 'rgba(255,255,255,0.94)', ink = C.ink, align = 'left' } = {}) {
  if (alpha <= 0.002) return 0;
  const w = measure(s, size, SANS, 500) + 58, h = size + 22;
  const x0 = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
  card(x0, y, w, h, { r: h / 2, fill, alpha, shadow: 0.08 });
  dot(x0 + 22, y + h / 2, 5.5, color, alpha);
  text(s, x0 + 38, y + h / 2 + 1, { size, weight: 500, color: ink, alpha, base: 'middle' });
  return w;
}
/** 发光的圆角框：画上、停住、淡出 */
function glow(x, y, w, h, a, { color = C.teal, r = 12, pad = 8 } = {}) {
  if (a <= 0.002) return;
  ctx.save(); ctx.globalAlpha = a;
  ctx.shadowColor = color; ctx.shadowBlur = 22;
  rrect(ctx, x - pad, y - pad, w + pad * 2, h + pad * 2, r);
  ctx.lineWidth = 3.5; ctx.strokeStyle = color; ctx.stroke();
  ctx.shadowBlur = 0; ctx.globalAlpha = a * 0.08; ctx.fillStyle = color; ctx.fill();
  ctx.restore();
}
function pop(tau) { return tau <= 0 ? 0 : 1 + 0.55 * Math.exp(-7 * tau) * Math.sin(17 * tau); }

// ─── 运动量（渲染时按它决定快门里取几次样） ───
let TRACK = [];
const track = (x, y, w, h) => TRACK.push([x, y, w, h]);

// ═══════════════════════════════════ 地面 ═══════════════════════════════════
function ground(t, drift = { x: 0, y: 0, z: 1 }) {
  ctx.fillStyle = C.paper; ctx.fillRect(0, 0, W, H);
  // 远处的点阵：随镜头慢慢滑，给运动一个参照
  const sp = 44 * Math.pow(drift.z, 0.35), ox = ((drift.x * 0.3) % sp + sp) % sp, oy = ((drift.y * 0.3) % sp + sp) % sp;
  ctx.fillStyle = 'rgba(38,36,31,0.055)';
  for (let y = oy - sp; y < H + sp; y += sp) for (let x = ox - sp; x < W + sp; x += sp) { ctx.beginPath(); ctx.arc(x, y, 1.3, 0, 6.2832); ctx.fill(); }
  const g = ctx.createRadialGradient(W / 2, H * 0.45, H * 0.35, W / 2, H * 0.45, H * 1.05);
  g.addColorStop(0, 'rgba(250,247,242,0)'); g.addColorStop(1, 'rgba(120,100,70,0.07)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

// ═══════════════════════════════ 1 · 由来 ═══════════════════════════════
const B1 = {};
function initB1() {
  B1.dot = 0.35;
  B1.date = 0.6;
  B1.card = at('o1', '测试') - 0.15;
  B1.pick = at('o1', '只答') + 0.15;
  B1.cardOut = T0('o3') - 0.05;
  B1.split = T0('o3') + 0.35;
  B1.cast = at('o3', '同时') - 0.1;
  B1.q = at('o4', '社会') - 0.1; // 大字在念到“社会”时出来（前面是“我想知道”）
  B1.grid = LN.o5.subs[1].t0 - 0.2;
  B1.tile = B1.grid - 0.75;
  B1.one = at('o5', '每次只改') - 0.1;
  B1.dive = T1('o5') + 0.1;
  B1.end = B1.dive + 0.85;
  const n = F.jevTownResidents;
  B1.pts = [...Array(n)].map((_, i) => {
    const r = 255 * Math.sqrt((i + 0.6) / n), a = i * 2.39996 + 0.4;
    return { x: 960 + r * Math.cos(a) * 1.18, y: 548 + r * Math.sin(a) * 0.92, d: r, ans: hash('ans', i) };
  });
  // 100 个小格子（重来一百遍）
  B1.tiles = [];
  const ts = 64, gap = 12, x0 = 960 - (10 * ts + 9 * gap) / 2, y0 = 548 - (10 * ts + 9 * gap) / 2;
  for (let j = 0; j < 10; j++) for (let i = 0; i < 10; i++) B1.tiles.push({ i, j, x: x0 + i * (ts + gap), y: y0 + j * (ts + gap), s: ts });
  B1.src = B1.tiles[4 * 10 + 4];
  B1.target = B1.tiles[3 * 10 + 6];
}
const OPTS = [['A', '照常出门'], ['B', '先问问邻居'], ['C', '改天再去'], ['D', '告诉家人']];
function drawB1(t) {
  if (t > B1.end + 0.05) return;
  // 推进：钻进一个格子（它会变成第一版的窗口）
  const kd = ease.expoIO(seg(t, B1.dive, B1.end));
  const tg = B1.target, Z = Math.exp(Math.log(1280 / tg.s) * kd);
  const tcx = tg.x + tg.s / 2, tcy = tg.y + tg.s / 2, px = lerp(tcx, 960, kd), py = lerp(tcy, 502, kd);
  ctx.save();
  ctx.setTransform(Z, 0, 0, Z, px - Z * tcx, py - Z * tcy);
  const fadeAll = 1 - seg(t, B1.dive + 0.55, B1.end);
  const others = 1 - ease.cubicOut(seg(t, B1.dive + 0.02, B1.dive + 0.4)); // 推进时其余格子先退场

  // 开场的点
  const kd0 = spring(t - B1.dot, 0.5, 15);
  const center = { x: 960, y: 548 };
  // 日期
  const rd = rise(t, B1.date), ld = leave(t, B1.card + 0.35, 0.35);

  // 选择题卡片：从点里长出来
  const kc = spring(t - B1.card, 0.78, 13), kco = ease.expoIO(seg(t, B1.cardOut, B1.cardOut + 0.45));
  const CW = 640, CH = 392, cx0 = 960 - CW / 2, cy0 = 352;
  const optY = (i) => cy0 + 196 + i * 46;
  const pickPos = { x: cx0 + 62, y: optY(1) };
  if (t >= B1.card && t < B1.cardOut + 0.5) {
    const k = kc * (1 - kco);
    const fromX = kco > 0 ? pickPos.x : center.x, fromY = kco > 0 ? pickPos.y : center.y;
    const x = lerp(fromX - 8, cx0, k), y = lerp(fromY - 8, cy0, k), w = lerp(16, CW, k), h = lerp(16, CH, k);
    card(x, y, w, h, { r: lerp(8, 16, k), alpha: clamp(k * 3) });
    track(x, y, w, h);
    const ca = clamp((k - 0.55) / 0.35);
    if (ca > 0) {
      text('Jev', cx0 + 44, cy0 + 72, { size: 46, face: SERIF, alpha: ca });
      text('TypeSafe 的快思考模型', cx0 + 128, cy0 + 70, { size: 23, color: C.ink2, alpha: ca });
      ctx.globalAlpha = ca; ctx.fillStyle = C.line; ctx.fillRect(cx0 + 44, cy0 + 100, CW - 88, 1.5); ctx.globalAlpha = 1;
      text('听到这条广播，你会怎么做？', cx0 + 44, cy0 + 150, { size: 28, alpha: ca });
      const kp = ease.expoOut(seg(t, B1.pick, B1.pick + 0.3));
      OPTS.forEach(([L0, s], i) => {
        const yy = optY(i);
        if (i === 1 && kp > 0) { ctx.globalAlpha = ca * kp * 0.09; ctx.fillStyle = C.teal; rrect(ctx, cx0 + 30, yy - 21, CW - 60, 42, 10); ctx.fill(); ctx.globalAlpha = 1; }
        ctx.globalAlpha = ca; ctx.strokeStyle = i === 1 && kp > 0.5 ? C.teal : C.mute; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx0 + 62, yy, 11, 0, 6.2832); ctx.stroke(); ctx.globalAlpha = 1;
        text(`${L0}  ${tr(s)}`, cx0 + 92, yy + 9, { size: 25, color: i === 1 && kp > 0.5 ? C.teal : C.ink, weight: i === 1 && kp > 0.5 ? 600 : 400, alpha: ca });
      });
      const kt = rise(t, B1.pick + 0.25);
      text('只回答选择题', cx0 + CW - 44, cy0 + 72, { size: 22, color: C.teal, align: 'right', weight: 500, alpha: ca * kt.op });
    }
  }
  // 点：先在中心，卡片打开后飞到 B，再回中心，分成 50 个
  let dp = { ...center };
  if (t >= B1.card) {
    const hop = ease.cubicIO(seg(t, B1.pick - 0.45, B1.pick));
    const p1 = { x: lerp(center.x, pickPos.x, hop), y: lerp(center.y, pickPos.y, hop) - Math.sin(hop * Math.PI) * 120 };
    const back = ease.cubicIO(seg(t, B1.cardOut, B1.split));
    dp = { x: lerp(p1.x, center.x, back), y: lerp(p1.y, center.y, back) };
  }
  const visDot = t < B1.split ? 1 : 0;
  dot(dp.x, dp.y, 11 * (t < B1.card + 0.1 ? kd0 : 1), C.teal, visDot);
  // 开场：点在呼吸，一圈淡淡的波纹
  if (t < B1.card + 0.3) for (const off of [0, 1.1]) {
    const u = ((t - B1.dot - 0.4 - off) % 2.2 + 2.2) % 2.2 / 2.2;
    if (t - B1.dot - 0.4 - off < 0) continue;
    ctx.globalAlpha = (1 - u) * 0.35 * (1 - seg(t, B1.card, B1.card + 0.3)); ctx.strokeStyle = C.teal; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(dp.x, dp.y, 11 + 70 * ease.cubicOut(u), 0, 6.2832); ctx.stroke(); ctx.globalAlpha = 1;
  }
  track(dp.x - 11, dp.y - 11, 22, 22);

  // jev-town：50 个居民
  if (t >= B1.split - 0.02) {
    const ql = rise(t, B1.split + 0.25), qlo = leave(t, B1.q + 0.25, 0.3);
    text(`jev-town · ${F.jevTownResidents} 个 AI 居民`, 960, 196 + ql.dy + qlo.dy, { size: 34, face: SERIF, align: 'center', alpha: ql.op * qlo.op * fadeAll });
    // 广播：中心的波纹
    const rings = [0, 0.2, 0.4].map((d) => seg(t, B1.cast + d, B1.cast + d + 1.5));
    rings.forEach((k) => {
      if (k <= 0 || k >= 1) return;
      ctx.globalAlpha = (1 - k) * 0.45 * fadeAll; ctx.strokeStyle = C.teal; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.ellipse(960, 548, 340 * ease.cubicOut(k) * 1.18, 340 * ease.cubicOut(k) * 0.92, 0, 0, 6.2832); ctx.stroke(); ctx.globalAlpha = 1;
    });
    const kb = rise(t, B1.cast - 0.15);
    // 进格子：收拢
    const kt = ease.expoIO(seg(t, B1.tile, B1.tile + 0.8));
    const src = B1.src, scx = src.x + src.s / 2, scy = src.y + src.s / 2;
    // 格子背景（收拢后出现）
    if (kt > 0) {
      const s = lerp(560, src.s, kt), a = clamp(kt * 2);
      card(lerp(960, scx, kt) - s / 2, lerp(548, scy, kt) - s / 2, s, s, { r: lerp(40, 12, kt), alpha: a * fadeAll * (t > B1.dive ? others : 1), shadow: 0.06 });
    }
    B1.pts.forEach((p, i) => {
      const k = spring(t - B1.split - i * 0.013, 0.7, 14);
      let x = lerp(960, p.x, k), y = lerp(548, p.y, k);
      // 收进格子
      x = lerp(x, scx + (p.x - 960) * (src.s * 0.36 / 300), kt); y = lerp(y, scy + (p.y - 548) * (src.s * 0.36 / 250), kt);
      const reach = B1.cast + (p.d / 340) * 1.1;
      const resp = t >= reach;
      const col = !resp ? C.mute : p.ans < 0.62 ? C.teal : p.ans < 0.86 ? C.amber : C.good;
      const r = lerp(9, 2.6, kt) * (resp ? pop(t - reach) : 1);
      dot(x, y, r, col, fadeAll * (t > B1.dive ? others : 1));
    });
    // 广播图标
    if (kt < 1) {
      const a = kb.op * (1 - kt) * fadeAll;
      dot(960, 548, 9, C.ink, a);
      ctx.globalAlpha = a; ctx.strokeStyle = C.ink; ctx.lineWidth = 2.5;
      for (const rr of [18, 28]) { ctx.beginPath(); ctx.arc(960, 548, rr, -0.7, 0.7); ctx.stroke(); ctx.beginPath(); ctx.arc(960, 548, rr, Math.PI - 0.7, Math.PI + 0.7); ctx.stroke(); }
      ctx.globalAlpha = 1;
    }
    // 问题
    const kq = rise(t, B1.q, { dist: 30 }), kqo = leave(t, B1.grid + 0.2, 0.4);
    text('社会，能被模拟吗？', 960, 200 + kq.dy + kqo.dy, { size: 84, face: SERIF, align: 'center', alpha: kq.op * kqo.op * fadeAll });
    // 一百遍
    if (t >= B1.grid - 0.05) {
      const flip = B1.one + 0.35;
      const pre = 1 - ease.smooth(seg(t, B1.dive - 0.25, B1.dive + 0.05)); // 推进前先把字和格子里的点收掉
      B1.tiles.forEach((tl, idx) => {
        if (tl === B1.src) return;
        const d = Math.hypot(tl.i - B1.src.i, tl.j - B1.src.j);

// B1 结束时目标格子在屏幕上的位置（第一版的窗口从这里长出来）

// ═══════════════════════════════ 字幕 ═══════════════════════════════
const HIDE_SUBS = new Set(['o4', 'c3']); // 画面上已经有同一句大字
const SUBS = [];
function initSubs() {
  FILM.lines.forEach((l) => { if (!HIDE_SUBS.has(l.id)) l.subs.forEach((s, i) => SUBS.push({ ...s, last: i === l.subs.length - 1 })); });
  // 每段字幕留到下一段开始，但句末最多多留 0.35 秒
  SUBS.forEach((s, i) => { const n = SUBS[i + 1]; s.hold = s.last ? Math.min(s.t1 + 0.35, n ? n.t0 : s.t1 + 0.35) : n ? n.t0 : s.t1; });
}
function drawSubs(t) {
  const s = SUBS.find((x) => t >= x.t0 - 0.04 && t < x.hold);
  if (!s) return;
  const a = Math.min(clamp((t - s.t0 + 0.04) / 0.1), clamp((s.hold - t) / 0.12));
  const size = 38, w = measure(s.text, size, SANS, 500) + 64, h = 66, y = 1010 - h / 2;
  ctx.save(); ctx.globalAlpha = a;
  ctx.shadowColor = 'rgba(38,36,31,0.1)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 6;
  rrect(ctx, 960 - w / 2, y, w, h, 14); ctx.fillStyle = 'rgba(255,255,255,0.93)'; ctx.fill();
  ctx.restore();
  text(s.text, 960, y + h / 2 + 2, { size, weight: 500, align: 'center', base: 'middle', alpha: a });
}

// ═══════════════════════════════ 总装 ═══════════════════════════════
function draw(tf) {
  const t = toAuth(tf); // 画面按编排时间画；字幕按片子时间
  TRACK = [];
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ground(t);
  drawB1(t);
  drawB2(t);
  const c4 = cam4(t);
  if (c4) { ctx.save(); ctx.setTransform(c4.z, 0, 0, c4.z, 960 - c4.z * c4.x, 540 - c4.z * c4.y); track(960 - c4.z * c4.x, 540 - c4.z * c4.y, 1920 * c4.z, 1080 * c4.z); }
  drawB3(t);
  drawB4(t);
  if (c4) ctx.restore();
  drawChips(t);
  drawCursor(cursorAt(t));
  if (!NOSUBS) drawSubs(tf);
  if (HUD) text(`${tf.toFixed(2)} s${EN ? ` (编排 ${t.toFixed(2)})` : ''}`, 20, 1066, { size: 18, color: '#c00' });
}
async function seek1(t) {
  for (let pass = 0; pass < 5; pass++) {
    PENDING = []; draw(t);
    if (!PENDING.length) return;
    await Promise.all(PENDING);
  }
}
/** 一帧里屏幕上走得最远的那个框（像素） */
function motionAt(t, h = 1 / 60) {
  NOLOAD = true;
  draw(t - h); const A = TRACK.slice(); draw(t + h); const B = TRACK.slice();
  NOLOAD = false;
  let m = 0;
  for (let i = 0; i < Math.min(A.length, B.length); i++) {
    const [ax, ay, aw, ah] = A[i], [bx, by, bw, bh] = B[i];
    const d = Math.max(Math.abs(ax - bx), Math.abs(ay - by), Math.abs(ax + aw - bx - bw), Math.abs(ay + ah - by - bh));
    if (d < 4000) m = Math.max(m, d);
  }
  return m;
}
const HUD = /hud/.test(location.search), NOSUBS = /nosubs|poster/.test(location.search), POSTER = /poster/.test(location.search);
window.__meta = { dur: DUR, fps: 30, lang: EN ? 'en' : 'zh' };
window.MC_FILM = FILM;
const SHUTTER = 0.34; // 快门 120°：界面里字多，糊得太狠就读不出来
window.__motion = (t) => motionAt(t);
/** 快门：一帧里走得多就多取几次样，在画布里平均 */
window.__seek = async (t, n) => {
  n = n ?? clamp(Math.ceil((motionAt(t) * SHUTTER) / 6), 1, 8);
  if (n <= 1) { await seek1(t); return 1; }
  const ts = [...Array(n)].map((_, i) => t + (i / (n - 1) - 0.5) * (SHUTTER / 30));
  for (const s of ts) await seek1(s);
  actx.setTransform(1, 0, 0, 1, 0, 0); actx.globalAlpha = 1; actx.clearRect(0, 0, W, H);
  for (let i = 0; i < n; i++) { await seek1(ts[i]); actx.globalAlpha = 1 / (i + 1); actx.drawImage(cv, 0, 0); }
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.drawImage(acc, 0, 0);
  return n;
};
/** 声音事件：点击与几次大的衔接 */
window.__events = () => [
  ...CLICKS.map((c) => ({ t: c.t, kind: 'click' })),
  { t: B1.pick, kind: 'click' }, { t: B1.cast, kind: 'cast' }, { t: B1.grid, kind: 'swell' }, { t: B1.dive, kind: 'whoosh' },
  { t: B2.gal, kind: 'whoosh-soft' }, { t: B3.iris, kind: 'whoosh' }, { t: B3.shrink, kind: 'whoosh' },
  { t: B4.c1, kind: 'tick' }, { t: B4.c2, kind: 'tick' }, { t: B4.c3, kind: 'tick' }, { t: B4.m1, kind: 'tick-soft' }, { t: B4.m2, kind: 'tick-soft' }, { t: B4.m3, kind: 'tick-soft' },
  { t: B4.gather, kind: 'whoosh-soft' }, { t: B4.flip + 0.25, kind: 'flip' }, { t: B4.mark, kind: 'land' },
].map((e) => ({ ...e, t: toFilm(e.t) })).sort((a, b) => a.t - b.t);
window.__ready = (async () => {
  const sample = EN ? 'MicroCity society 微缩城' : '微缩城社会';
  await Promise.all([600, 500, 400].flatMap((w) => [document.fonts.load(`${w} 80px ${SERIF}`, sample), document.fonts.load(`${w} 38px ${SANS}`, sample)]));
  initWarp();
  initB1(); initB2(); initB3(); initB4(); initSubs();
  await seek1(0);
  return true;
})();
// ?t=12.3 停在某一刻；?play 实时播放
const q = new URLSearchParams(location.search);
window.__ready.then(async () => {
  if (q.has('t')) await window.__seek(Number(q.get('t')));
  if (q.has('play')) { const t0 = performance.now() - Number(q.get('from') ?? 0) * 1000; const loop = async () => { await seek1((performance.now() - t0) / 1000 % DUR); requestAnimationFrame(loop); }; loop(); }
});
</script>
